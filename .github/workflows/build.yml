name: build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }         # Apple Silicon
          - { runner: macos-15-intel, arch: intel }   # x86_64; macos-13 is retired
    runs-on: ${{ matrix.runner }}
    env:
      PT_VERSION: "0.0.0"          # overwritten below on a tag build
    steps:
      - name: version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: |
          test -f models/Player_Detection.pt || { echo "models/ missing (Git LFS?)"; exit 1; }
          pip install -r webapp/requirements.txt pywebview pyinstaller
          brew install create-dmg
      - name: pin the last Intel-compatible torch
        if: matrix.arch == 'intel'
        # PyTorch stopped shipping macOS x86_64 wheels after 2.2.2, and that
        # build is compiled against numpy 1.x.
        run: pip install "torch==2.2.2" "torchvision==0.17.2" "numpy<2"
      - run: PY=python bash webapp/packaging/build_macos.sh
      - name: selftest
        run: "'webapp/dist/Player Tracking.app/Contents/MacOS/PlayerTracking' --selftest"
      - uses: actions/upload-artifact@v4
        with:
          name: PlayerTracking-macOS-${{ matrix.arch }}
          path: webapp/dist/PlayerTracking-macOS-${{ matrix.arch }}.dmg

  windows:
    runs-on: windows-latest
    env:
      PT_VERSION: "0.0.0"
    steps:
      - name: version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PT_VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r webapp/requirements.txt pywebview pyinstaller
      - name: WebView2 bootstrapper
        run: curl -L -o webapp/packaging/MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
      - name: Inno Setup
        # Not part of the runner image: it ships WiX and Chocolatey only.
        run: choco install innosetup -y --no-progress
      - run: |
          cd webapp
          python tools/make_icons.py
          python -m PyInstaller packaging/player_tracking.spec --noconfirm
      - name: selftest
        run: |
          $p = Start-Process -FilePath "webapp\dist\PlayerTracking\PlayerTracking.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content webapp\dist\PlayerTracking\psf_selftest.log; exit 1 }
      - name: installer
        run: |
          cd webapp/packaging
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$env:PT_VERSION" player_tracking.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PlayerTracking-Windows
          path: webapp/dist/PlayerTracking-Setup.exe

  # A tag run also publishes the three installers as a Release: Actions
  # artifacts expire after 90 days and are invisible to anyone not signed in.
  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
        # Creating the release from the website makes the tag first, so the
        # release may already exist by the time this runs; then just upload.
      - run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*/* --repo "$GITHUB_REPOSITORY" \
               --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" artifacts/*/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
