{% extends "base.html" %}
{% block title %}Результаты{% endblock %}

{% block content %}
<div class="page-header">
    <h1 data-i18n="rl_title">Архив</h1>
    <p class="page-desc" data-i18n="rl_desc">Все обработанные видео на этом компьютере</p>
</div>

<div id="resultsList"></div>
<div id="emptyState" style="display:none" class="card" style="text-align:center;padding:3rem">
    <p style="color:var(--text-muted)">
        <span data-i18n="rl_empty_prefix">Нет сохранённых результатов.</span>
        <a href="/upload" data-i18n="rl_empty_link">Загрузите видео</a>
        <span data-i18n="rl_empty_suffix">для обработки.</span>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
let __jobsCache = null;

function render(jobs) {
    const container = document.getElementById('resultsList');
    container.innerHTML = '';

    if (!jobs.length) {
        document.getElementById('emptyState').style.display = '';
        return;
    }
    document.getElementById('emptyState').style.display = 'none';

    const lang = PSF_I18N.getLang();
    const localeTag = lang === 'ru' ? 'ru-RU' : 'en-US';

    let html = '';
    for (const job of jobs) {
        const date = new Date(job.created * 1000).toLocaleString(localeTag);
        const statusBadge = job.status === 'completed'
            ? `<span class="status-badge status-completed">${PSF_I18N.t('rl_status_completed')}</span>`
            : `<span class="status-badge status-review">${PSF_I18N.t('rl_status_review')}</span>`;

        let details = '';
        if (job.groups_count != null) details += `<span>${PSF_I18N.t('rl_players')}: ${job.groups_count}</span>`;
        if (job.video_count != null) details += `<span>${PSF_I18N.t('rl_videos')}: ${job.video_count}</span>`;
        if (job.unidentified_count) details += `<span>${PSF_I18N.t('rl_unid')}: ${job.unidentified_count}</span>`;

        let accuracy = '';
        if (job.accuracy) {
            accuracy = `<div class="result-accuracy">${PSF_I18N.t('rl_accuracy')}: <strong>${job.accuracy.accuracy_pct}%</strong> (${job.accuracy.correct} ${PSF_I18N.t('rl_acc_correct')}, ${job.accuracy.corrected} ${PSF_I18N.t('rl_acc_corrected')}, ${job.accuracy.rejected} ${PSF_I18N.t('rl_acc_rejected')})</div>`;
        }

        let actions = '';
        if (job.status === 'review') {
            actions += `<a href="/review/${job.job_id}" class="btn btn-primary btn-sm">${PSF_I18N.t('rl_btn_continue')}</a>`;
        }
        if (job.has_excel) {
            actions += `<a href="/results/${job.excel_path}" class="btn btn-sm" download>${PSF_I18N.t('rl_btn_excel')}</a>`;
        }
        if (job.status === 'completed') {
            actions += `<a href="/result/${job.job_id}" class="btn btn-sm">${PSF_I18N.t('rl_btn_view')}</a>`;
        }
        actions += `<button class="btn btn-sm btn-danger-outline" onclick="deleteJob('${job.job_id}', this)">${PSF_I18N.t('rl_btn_delete')}</button>`;

        html += `
            <div class="card result-card" id="row-${job.job_id}">
                <div class="result-card-header">
                    <div>
                        <span class="result-job-id">${job.job_id}</span>
                        ${statusBadge}
                    </div>
                    <span class="result-date">${date}</span>
                </div>
                <div class="result-card-details">${details}</div>
                ${accuracy}
                <div class="result-card-actions">${actions}</div>
            </div>
        `;
    }
    container.innerHTML = html;
}

// Inline confirm — native confirm() is suppressed in the desktop webview, so a
// plain confirm()-guarded delete silently does nothing. Turn the button into a
// two-step "Delete permanently? [Yes] [Cancel]" instead.
function deleteJob(jobId, btn) {
    const actions = btn.parentElement;
    btn.style.display = 'none';
    const wrap = document.createElement('span');
    wrap.style.cssText = 'display:inline-flex;gap:.4rem;align-items:center;flex-wrap:wrap';
    const msg = document.createElement('span');
    msg.style.cssText = 'color:var(--text-muted);font-size:.82rem';
    msg.textContent = PSF_I18N.t('rl_confirm_delete_short');
    const yes = document.createElement('button');
    yes.className = 'btn btn-sm btn-danger-outline';
    yes.textContent = PSF_I18N.t('rl_btn_delete_yes');
    const no = document.createElement('button');
    no.className = 'btn btn-sm';
    no.textContent = PSF_I18N.t('rl_btn_cancel');
    wrap.append(msg, yes, no);
    actions.appendChild(wrap);
    no.onclick = () => { wrap.remove(); btn.style.display = ''; };
    yes.onclick = async () => {
        yes.disabled = true; no.disabled = true;
        try {
            const r = await fetch(`/api/job/${jobId}`, {method: 'DELETE'});
            if (!r.ok) throw new Error('http ' + r.status);
            __jobsCache = __jobsCache.filter(j => j.job_id !== jobId);
            document.getElementById(`row-${jobId}`)?.remove();
            if (!__jobsCache.length) document.getElementById('emptyState').style.display = '';
        } catch (e) {
            msg.textContent = PSF_I18N.t('rl_delete_err');
            yes.disabled = false; no.disabled = false;
        }
    };
}

async function load() {
    const resp = await fetch('/api/results-list');
    __jobsCache = await resp.json();
    render(__jobsCache);
}

if (window.PSF_I18N) {
    PSF_I18N.onChange(() => { if (__jobsCache) render(__jobsCache); });
}

load();
</script>
{% endblock %}
